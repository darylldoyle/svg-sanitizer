name: Tests

on: [push, pull_request]

jobs:
  build:
    name: PHP ${{ matrix.php }}, PCRE JIT ${{ matrix.jit == '1' && 'on' || 'off' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        # Some regex paths are only slow, or only fail, with PCRE's JIT on or
        # off, so run every PHP version both ways.
        jit: ['0', '1']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: pcre.jit=${{ matrix.jit }}
          # No Xdebug: it slows the timing tests, and Xdebug 2 (PHP 7.1) stops
          # recursion past 256 calls, which deeply nested test documents reach.
          # Coverage runs in its own workflow.
          coverage: none

      - name: Show PHP, libxml and PCRE JIT versions
        run: php -r 'printf("PHP %s, libxml %s, pcre.jit=%s\n", PHP_VERSION, LIBXML_DOTTED_VERSION, ini_get("pcre.jit"));'

      - name: Validate composer.json
        run: composer validate

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -dxdebug.mode=off -l

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: composer run-script test
